<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Lê Thành Tâm (tem) - IT Student, AI and Big Data" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0b0a24"/>
      <stop offset="1" stop-color="#1a0b33"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.9" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="type">
      <rect x="290" y="180" height="30" width="0">
        <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.5;0.9;1" dur="5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- background -->
  <rect x="1" y="1" width="998" height="278" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="278" rx="22" fill="url(#glowL)"/>
  <rect x="1" y="1" width="998" height="278" rx="22" fill="url(#glowR)"/>

  <!-- neon border -->
  <rect x="1.5" y="1.5" width="997" height="277" rx="22" fill="none" stroke="url(#neon)" stroke-width="3" filter="url(#blur)" opacity="0.8"/>
  <rect x="1.5" y="1.5" width="997" height="277" rx="22" fill="none" stroke="url(#neon)" stroke-width="1.5"/>

  <!-- pill -->
  <rect x="300" y="28" width="400" height="32" rx="16" fill="#080620" stroke="#4c1d95"/>
  <circle cx="324" cy="44" r="5" fill="#22d3ee" filter="url(#soft)"/>
  <text x="340" y="49" fill="#c7d2fe" font-family="Consolas, Menlo, monospace" font-size="13">Vietnam Aerospace University · AI &amp; Big Data</text>

  <!-- name -->
  <text x="500" y="118" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="50" font-weight="700" filter="url(#soft)">Lê Thành Tâm</text>
  <text x="500" y="152" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">IT Student · Aspiring <tspan fill="#22d3ee">Full-Stack</tspan> <tspan fill="#d946ef">Developer</tspan></text>

  <!-- terminal -->
  <rect x="270" y="172" width="460" height="42" rx="10" fill="#080620" stroke="#4c1d95"/>
  <text x="290" y="199" fill="#d946ef" font-family="Consolas, Menlo, monospace" font-size="15" clip-path="url(#type)">&gt; for fun and for work</text>
  <rect x="640" y="183" width="3" height="20" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="500" y="246" text-anchor="middle" fill="#6b7280" font-family="Consolas, Menlo, monospace" font-size="12">aka tem · Vietnam</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
